name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "BTChipCodecInspector-source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q BTChipCodecInspector-source.zip -d project
          test -f project/BTChipCodecInspector/settings.gradle

      - name: Build debug APK
        working-directory: project/BTChipCodecInspector
        run: gradle --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp project/BTChipCodecInspector/app/build/outputs/apk/debug/app-debug.apk out/BTChipCodecInspector-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTChipCodecInspector-APK
          path: out/BTChipCodecInspector-debug.apk
          if-no-files-found: error
          retention-days: 30
